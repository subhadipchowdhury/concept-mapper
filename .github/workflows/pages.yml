name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fails the build (and so skips deployment) on malformed or unreachable
      # map data, keeping a broken map from reaching students.
      - name: Validate map data
        run: python tools/validate_maps.py

      # A raw newline inside a JS string is a syntax error that blanks the whole
      # page. esbuild catches it below, but this runs without Node so it can also
      # be run locally, and it fails with a clearer message.
      - name: Check JS string literals
        run: python tools/check_js_strings.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No package-lock.json is committed, so `npm install` is the right call.
      - name: Install build dependencies
        run: npm install

      # Precompiles the JSX, swaps in React's production build and vendors it
      # locally, then writes a self-contained ./build. index.html itself stays
      # tooling-free for local preview — see tools/build.mjs for why.
      - name: Build production site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
